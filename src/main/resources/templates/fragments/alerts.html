<div aria-live="polite" class="toast-container" id="toast-container" th:fragment="toast-container"></div>

<div th:fragment="alerts">
    <div class="toast toast-success" role="alert" th:if="${param.success}">
        <span class="toast-message" th:text="${param.success}"></span>
        <button aria-label="Dismiss" class="toast-close" onclick="this.parentElement.remove()">&times;</button>
    </div>
    <div class="toast toast-error" role="alert" th:if="${param.error}">
        <span class="toast-message" th:text="${param.error}"></span>
        <button aria-label="Dismiss" class="toast-close" onclick="this.parentElement.remove()">&times;</button>
    </div>
</div>

<script th:fragment="toast-js">
    document.addEventListener('DOMContentLoaded', function () {
        var urlParams = new URLSearchParams(window.location.search);
        var successMsg = urlParams.get('success');
        var errorMsg = urlParams.get('error');
        if (successMsg && typeof showToast === 'function') showToast(successMsg, 'success');
        if (errorMsg && typeof showToast === 'function') showToast(errorMsg, 'error');
    });
</script>
