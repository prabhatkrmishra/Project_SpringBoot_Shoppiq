<!DOCTYPE html>
<html lang="en" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title th:text="${title}">Shoppiq</title>
    <meta content="Shoppiq — your modern shopping destination" name="description">
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <meta content="true" name="shoppiq-authenticated" sec:authorize="isAuthenticated()">
    <meta name="shoppiq-user-id" sec:authorize="isAuthenticated()" th:content="${#authentication?.principal?.user?.id}">
    <link rel="icon" th:href="@{/images/favicon.svg}" type="image/svg+xml">
    <link href="https://fonts.googleapis.com" rel="preconnect">
    <link crossorigin href="https://fonts.gstatic.com" rel="preconnect">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="stylesheet" th:href="@{/css/chat.css}">
    <script defer src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
    <script defer th:src="@{/js/api.js}"></script>
    <script defer th:src="@{/js/productCard.js}"></script>
    <script defer th:src="@{/js/cart.js}"></script>
    <script defer th:src="@{/js/main.js}"></script>
    <script defer th:src="@{/js/chat.js}"></script>
</head>
<body>
    <th:block th:fragment="header">
        <header class="site-header">
            <div class="header-inner">
                <a aria-label="Shoppiq Home" class="header-brand" th:href="@{/}">Shoppiq</a>
                <nav aria-label="Main navigation" class="header-nav">
                    <a th:href="@{/allitems}"><i class="icon-sm" data-lucide="store"></i><span>Shop</span></a>
                    <a th:href="@{/new-arrivals}"><i class="icon-sm"
                                                     data-lucide="sparkles"></i><span>New Arrivals</span></a>
                    <a th:href="@{/sale}"><i class="icon-sm" data-lucide="tag"></i><span>Sale</span></a>
                    <a th:href="@{/categories}"><i class="icon-sm" data-lucide="layout-grid"></i><span>Categories</span></a>
                    <a sec:authorize="isAuthenticated() and !hasRole('ADMIN') and !hasRole('SELLER')"
                       th:href="@{/cart}"><i
                            class="icon-sm"
                            data-lucide="shopping-cart"></i><span>Cart</span><span class="badge-count" style="display:none">0</span></a>
                    <a sec:authorize="isAuthenticated() and !hasRole('ADMIN') and !hasRole('SELLER')"
                       th:href="@{/orders}"><i class="icon-sm"
                                               data-lucide="package"></i><span>Orders</span></a>
                    <a sec:authorize="isAuthenticated()" th:href="@{/profile}"><i class="icon-sm"
                                                                                  data-lucide="user"></i><span>Profile</span></a>
                    <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin/dashboard}"><i class="icon-sm"
                                                                                         data-lucide="shield"></i><span>Admin</span></a>
                </nav>
                <div class="header-actions">
                    <div sec:authorize="!isAuthenticated()">
                        <a class="btn btn-sm btn-header-outlined" th:href="@{/login}"><i class="icon-sm"
                                                                                         data-lucide="log-in"></i> Sign
                            In</a>
                    </div>
                    <div class="flex items-center gap-xs" sec:authorize="isAuthenticated()">
                        <a class="btn btn-sm btn-header-ghost" id="header-user-name"
                           sec:authentication="principal.user.name"
                           th:href="@{/profile}">Account</a>
                        <a class="btn btn-sm btn-header-muted" href="#" onclick="window.handleLogout(event)"><i
                                class="icon-sm"
                                data-lucide="log-out"></i> Logout</a>
                    </div>
                    <button aria-expanded="false" aria-label="Toggle menu" class="menu-toggle">
                        <span></span><span></span><span></span>
                    </button>
                </div>
            </div>
            <div aria-hidden="true" class="mobile-menu">
                <a th:href="@{/allitems}"><i class="icon-sm" data-lucide="store"></i><span>Shop</span></a>
                <a th:href="@{/new-arrivals}"><i class="icon-sm"
                                                 data-lucide="sparkles"></i><span>New Arrivals</span></a>
                <a th:href="@{/sale}"><i class="icon-sm" data-lucide="tag"></i><span>Sale</span></a>
                <a th:href="@{/categories}"><i class="icon-sm" data-lucide="layout-grid"></i><span>Categories</span></a>
                <a sec:authorize="isAuthenticated() and !hasRole('ADMIN') and !hasRole('SELLER')" th:href="@{/cart}"><i
                        class="icon-sm"
                        data-lucide="shopping-cart"></i><span>Cart</span><span class="badge-count" style="display:none">0</span></a>
                <a sec:authorize="isAuthenticated() and !hasRole('ADMIN') and !hasRole('SELLER')"
                   th:href="@{/orders}"><i
                        class="icon-sm"
                        data-lucide="package"></i><span>Orders</span></a>
                <a sec:authorize="isAuthenticated()" th:href="@{/profile}"><i class="icon-sm"
                                                                              data-lucide="user"></i><span>Profile</span></a>
                <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin/dashboard}"><i class="icon-sm"
                                                                                     data-lucide="shield"></i><span>Admin</span></a>
                <hr class="mobile-menu-divider">
                <a sec:authorize="!isAuthenticated()" th:href="@{/login}"><i class="icon-sm"
                                                                             data-lucide="log-in"></i><span>Sign In</span></a>
                <a href="#" onclick="window.handleLogout(event)" sec:authorize="isAuthenticated()"><i
                        class="icon-sm"
                        data-lucide="log-out"></i><span>Logout</span></a>
            </div>
        </header>
        <button aria-label="Back to top" class="back-to-top">
            <i class="icon" data-lucide="arrow-up"></i>
        </button>
        <th:block th:replace="~{fragments/chat-widget :: widget}"></th:block>
    </th:block>
</body>
</html>
