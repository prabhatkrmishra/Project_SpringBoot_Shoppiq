<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Cart')}"></head>
<body>
    <th:block th:replace="~{fragments/header :: header}"></th:block>
    <th:block th:replace="~{fragments/alerts :: toast-container}"></th:block>

    <main class="page">
        <div class="container">
            <div class="page-header">
                <h1>Shopping Cart</h1>
            </div>

            <div class="checkout-progress" role="progressbar" aria-valuenow="1" aria-valuemin="1" aria-valuemax="3">
                <span class="step active"><span class="step-dot"></span> Cart</span>
                <span class="step-line"></span>
                <span class="step"><span class="step-dot"></span> Details</span>
                <span class="step-line"></span>
                <span class="step"><span class="step-dot"></span> Pay</span>
            </div>

            <div id="cart-empty" class="cart-empty" style="display:none;">
                <h2>Your cart is empty</h2>
                <p>Looks like you haven't added anything yet.</p>
                <a href="/allitems" class="btn btn-primary">Start Shopping</a>
            </div>

            <div id="cart-content" class="cart-page" style="display:none;">
                <div class="cart-items" id="cart-items"></div>

                <aside class="cart-summary" aria-label="Order summary">
                    <div class="cart-summary-title">Order Summary</div>
                    <div class="cart-summary-row">
                        <span>Subtotal</span>
                        <span id="cart-subtotal">$0.00</span>
                    </div>
                    <div id="cart-discount-row" class="cart-summary-row" style="display:none;">
                        <span>Discount</span>
                        <span id="cart-discount" class="text-success">-$0.00</span>
                    </div>
                    <div class="cart-summary-row">
                        <span>Shipping</span>
                        <span id="cart-shipping">Calculated at checkout</span>
                    </div>
                    <div class="cart-summary-row total">
                        <span>Total</span>
                        <span id="cart-total">$0.00</span>
                    </div>
                    <div class="cart-promo" id="cart-promo-apply-section">
                        <input type="text" id="cart-promo-input" class="form-input" placeholder="Promo code"
                               aria-label="Promo code">
                        <button type="button" id="cart-promo-apply" class="btn btn-sm btn-secondary">Apply</button>
                        <button type="button" id="cart-promo-remove" class="btn btn-sm btn-danger" style="display:none;">Remove</button>
                    </div>
                    <div id="cart-promo-msg" style="display:none;" class="text-sm mt-sm"></div>
                    <div class="cart-actions">
                        <a href="/checkout" class="btn btn-primary btn-lg">Proceed to Checkout</a>
                        <a href="/allitems" class="btn btn-secondary">Continue Shopping</a>
                    </div>
                </aside>
            </div>
        </div>
    </main>

    <div id="cart-mobile-cta" class="cart-mobile-cta" style="display:none;">
        <div class="cart-total-mobile">Total: <strong id="cart-total-mobile">$0.00</strong></div>
        <a href="/checkout" class="btn btn-primary">Checkout</a>
    </div>

    <th:block th:replace="~{fragments/footer :: footer}"></th:block>
    <script src="/js/sanitize.js"></script>
    <script>
        (function () {
            'use strict';
            var cartData = null;
            var appliedPromoCode = null;
            var appliedDiscount = 0;

            function renderCart(cart) {
                cartData = cart;
                var items = cart.items || [];
                if (items.length === 0) {
                    document.getElementById('cart-empty').style.display = '';
                    document.getElementById('cart-content').style.display = 'none';
                    document.getElementById('cart-mobile-cta').style.display = 'none';
                    return;
                }
                document.getElementById('cart-empty').style.display = 'none';
                document.getElementById('cart-content').style.display = '';
                document.getElementById('cart-mobile-cta').style.display = '';

                var container = document.getElementById('cart-items');
                container.innerHTML = '';
                items.forEach(function (item) {
                    var imgUrl = item.imageUrl || 'https://plus.unsplash.com/premium_photo-1683746792239-6ce8cdd3ac78?q=80&w=100&fit=crop';
                    var div = document.createElement('div');
                    div.className = 'cart-item';
                    div.dataset.cartItemId = item.cartItemId;
                    div.innerHTML =
                        '<img class="cart-item-image" src="' + escapeAttr(imgUrl) + '" alt="" loading="lazy" width="100" height="100">' +
                        '<div class="cart-item-details">' +
                        '<div class="cart-item-name"><a href="/item/' + escapeAttr(item.itemSlug) + '">' + escapeHtml(item.itemName || 'Product') + '</a></div>' +
                        '<div class="cart-item-price">' + formatCurrency(item.unitPrice) + '</div>' +
                        '<div class="cart-item-actions">' +
                        '<div class="quantity-control">' +
                        '<button class="qty-minus" data-cart-item-id="' + item.cartItemId + '" data-qty="' + item.quantity + '" aria-label="Decrease quantity">&minus;</button>' +
                        '<input type="number" value="' + item.quantity + '" min="1" max="99" aria-label="Quantity" readonly>' +
                        '<button class="qty-plus" data-cart-item-id="' + item.cartItemId + '" data-qty="' + item.quantity + '" aria-label="Increase quantity">+</button>' +
                        '</div>' +
                        '<button class="cart-item-remove" data-cart-item-id="' + item.cartItemId + '" aria-label="Remove item">Remove</button>' +
                        '</div>' +
                        '</div>' +
                        '<div class="cart-item-subtotal">' + formatCurrency(item.lineTotal) + '</div>';
                    container.appendChild(div);
                });

                document.getElementById('cart-subtotal').textContent = formatCurrency(cart.subtotal);

                if (appliedPromoCode && appliedDiscount > 0) {
                    document.getElementById('cart-discount-row').style.display = '';
                    document.getElementById('cart-discount').textContent = '-' + formatCurrency(appliedDiscount);
                    document.getElementById('cart-total').textContent = formatCurrency(cart.subtotal - appliedDiscount);
                    document.getElementById('cart-total-mobile').textContent = formatCurrency(cart.subtotal - appliedDiscount);
                } else {
                    document.getElementById('cart-discount-row').style.display = 'none';
                    document.getElementById('cart-total').textContent = formatCurrency(cart.subtotal);
                    document.getElementById('cart-total-mobile').textContent = formatCurrency(cart.subtotal);
                }

                bindEvents();
            }

            function bindEvents() {
                document.querySelectorAll('.qty-minus').forEach(function (btn) {
                    btn.onclick = function () {
                        var id = parseInt(this.dataset.cartItemId);
                        var qty = parseInt(this.dataset.qty) - 1;
                        if (qty < 1) return;
                        API.put('/user/cart/update/' + id, {quantity: qty}).then(function () { loadCart(); window.updateCartBadge(); }).catch(function (e) {
                            showToast(e.message, 'error');
                        });
                    };
                });
                document.querySelectorAll('.qty-plus').forEach(function (btn) {
                    btn.onclick = function () {
                        var id = parseInt(this.dataset.cartItemId);
                        var qty = parseInt(this.dataset.qty) + 1;
                        if (qty > 99) return;
                        API.put('/user/cart/update/' + id, {quantity: qty}).then(function () { loadCart(); window.updateCartBadge(); }).catch(function (e) {
                            showToast(e.message, 'error');
                        });
                    };
                });
                document.querySelectorAll('.cart-item-remove').forEach(function (btn) {
                    btn.onclick = function () {
                        var id = parseInt(this.dataset.cartItemId);
                        showConfirmModal({
                            title: 'Remove Item',
                            message: 'Remove this item?',
                            confirmText: 'Remove',
                            danger: true
                        }).then(function (confirmed) {
                            if (!confirmed) return;
                            API.del('/user/cart/delete/' + id).then(function () { loadCart(); window.updateCartBadge(); }).catch(function (e) {
                                showToast(e.message, 'error');
                            });
                        });
                    };
                });
            }

            function loadCart() {
                API.get('/user/cart/get').then(function (cart) {
                    renderCart(cart);
                    if (appliedPromoCode) {
                        /* Reset promo display — the discount amount may be stale
                           after a qty change.  Show raw totals and let the user
                           re-apply, or the code will be re-validated at checkout.
                           This avoids an extra API call on every cart change. */
                        appliedDiscount = 0;
                        document.getElementById('cart-discount-row').style.display = 'none';
                        document.getElementById('cart-total').textContent = formatCurrency(cart.subtotal);
                        document.getElementById('cart-total-mobile').textContent = formatCurrency(cart.subtotal);
                        var msgEl = document.getElementById('cart-promo-msg');
                        msgEl.style.display = 'block';
                        msgEl.innerHTML = '<span class="text-muted">Your cart changed — promo will be re-applied at checkout.</span>';
                        /* Keep appliedPromoCode + sessionStorage intact for checkout */
                    }
                }).catch(function () {
                    document.getElementById('cart-empty').style.display = '';
                    document.getElementById('cart-content').style.display = 'none';
                });
            }

            function showPromoApplied(discountAmount) {
                var msgEl = document.getElementById('cart-promo-msg');
                msgEl.style.display = 'block';
                msgEl.innerHTML = '<span class="text-success">Promo applied! You save ' + formatCurrency(discountAmount) + '</span>';
                document.getElementById('cart-discount-row').style.display = '';
                document.getElementById('cart-discount').textContent = '-' + formatCurrency(discountAmount);
                document.getElementById('cart-total').textContent = formatCurrency(cartData.subtotal - discountAmount);
                document.getElementById('cart-total-mobile').textContent = formatCurrency(cartData.subtotal - discountAmount);

                document.getElementById('cart-promo-apply').style.display = 'none';
                document.getElementById('cart-promo-remove').style.display = '';
                document.getElementById('cart-promo-input').value = appliedPromoCode;
                document.getElementById('cart-promo-input').disabled = true;
            }

            function clearPromoState(message) {
                appliedPromoCode = null;
                appliedDiscount = 0;
                sessionStorage.removeItem('promoCode');

                var msgEl = document.getElementById('cart-promo-msg');
                if (message) {
                    msgEl.style.display = 'block';
                    msgEl.innerHTML = '<span class="text-danger">' + escapeHtml(message) + '</span>';
                } else {
                    msgEl.style.display = 'none';
                }

                document.getElementById('cart-discount-row').style.display = 'none';
                document.getElementById('cart-total').textContent = formatCurrency(cartData.subtotal);
                document.getElementById('cart-total-mobile').textContent = formatCurrency(cartData.subtotal);

                var applyBtn = document.getElementById('cart-promo-apply');
                applyBtn.style.display = '';
                applyBtn.textContent = 'Apply';
                applyBtn.disabled = false;
                document.getElementById('cart-promo-remove').style.display = 'none';
                document.getElementById('cart-promo-input').disabled = false;
            }

            function buildCartPreviewItems() {
                if (!cartData || !cartData.items) return [];
                return cartData.items.map(function (item) {
                    return {
                        itemDetailsId: item.itemDetailsId,
                        quantity: item.quantity,
                        unitPrice: item.unitPrice
                    };
                });
            }

            function applyPromoCode() {
                var input = document.getElementById('cart-promo-input');
                var msgEl = document.getElementById('cart-promo-msg');
                var code = input.value.trim();
                if (!code) {
                    msgEl.style.display = 'block';
                    msgEl.innerHTML = '<span class="text-danger">Please enter a promo code</span>';
                    return;
                }
                var btn = document.getElementById('cart-promo-apply');
                setButtonLoading(btn, true);
                API.post('/api/promo-codes/validate', {
                    code: code,
                    subtotal: cartData.subtotal,
                    cartItems: buildCartPreviewItems()
                }).then(function (res) {
                    appliedPromoCode = code;
                    appliedDiscount = parseFloat(res.discount);
                    sessionStorage.setItem('promoCode', code);
                    showPromoApplied(appliedDiscount);
                    setButtonLoading(btn, false);
                }).catch(function (err) {
                    clearPromoState(err.message || 'Invalid promo code');
                    setButtonLoading(btn, false);
                });
            }

            function removePromo() {
                clearPromoState(null);
                document.getElementById('cart-promo-input').value = '';
                document.getElementById('cart-promo-msg').style.display = 'none';
            }

            document.addEventListener('DOMContentLoaded', function () {
                loadCart();
                document.getElementById('cart-promo-apply').addEventListener('click', applyPromoCode);
                document.getElementById('cart-promo-remove').addEventListener('click', removePromo);
            });
        })();
    </script>
</body>
</html>
