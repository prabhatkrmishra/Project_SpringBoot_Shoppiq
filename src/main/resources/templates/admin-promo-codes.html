<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Manage Promo Codes')}"></head>
<body>
    <th:block th:replace="~{fragments/admin-header :: admin-header('promo-codes')}"></th:block>
    <th:block th:replace="~{fragments/alerts :: toast-container}"></th:block>

    <main class="admin-main">
        <div class="page-header flex-between items-center">
            <div>
                <h1>Promo Codes</h1>
                <p>Manage promotional discount codes</p>
            </div>
            <div class="flex gap-sm">
                <button class="btn btn-primary btn-sm" id="add-promo-btn">+ Add Promo Code</button>
            </div>
        </div>

        <div class="admin-panel">
            <div class="admin-panel-header">
                <div class="admin-panel-title">All Promo Codes</div>
            </div>
            <div class="table-responsive">
                <table class="admin-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Code</th>
                            <th>Type</th>
                            <th>Coupon Type</th>
                            <th>Value</th>
                            <th>Min Order</th>
                            <th>Min Qty</th>
                            <th>Max Discount</th>
                            <th>Usage</th>
                            <th>Valid From</th>
                            <th>Valid Until</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="promo-body">
                        <tr>
                            <td class="text-center text-muted" colspan="13">Loading...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div id="promo-pagination"></div>

        <div class="modal-overlay" id="promo-modal">
            <div aria-labelledby="promo-modal-title" class="modal" role="dialog" style="max-width:560px;">
                <div class="modal-header">
                    <h2 id="promo-modal-title">Add Promo Code</h2>
                    <button class="modal-close" id="promo-modal-close">&times;</button>
                </div>
                <form class="modal-body" id="promo-form">
                    <input id="promo-id" type="hidden" value="">
                    <div class="form-group">
                        <label class="form-label" for="promo-code">Code *</label>
                        <input class="form-input" id="promo-code" maxlength="50" placeholder="e.g. SAVE20" required
                               type="text">
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="promo-description">Description</label>
                        <input class="form-input" id="promo-description" maxlength="255" placeholder="Optional description"
                               type="text">
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label" for="promo-discount-type">Discount Type *</label>
                            <select class="form-input" id="promo-discount-type" required>
                                <option value="PERCENTAGE">Percentage (%)</option>
                                <option value="FIXED_AMOUNT">Fixed Amount ($)</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="promo-discount-value">Discount Value *</label>
                            <input class="form-input" id="promo-discount-value" min="0.01" placeholder="e.g. 20" required
                                   step="0.01" type="number">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label" for="promo-coupon-type">Coupon Type</label>
                            <select class="form-input" id="promo-coupon-type">
                                <option value="">None (no cart constraint)</option>
                                <option value="SINGLE">Single — all items qty = 1</option>
                                <option value="BULK">Bulk — at least one item qty &gt; 1</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="promo-min-item-qty">Min Item Quantity</label>
                            <input class="form-input" id="promo-min-item-qty" min="0" placeholder="None"
                                   type="number">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label" for="promo-min-order">Min Order Amount</label>
                            <input class="form-input" id="promo-min-order" min="0" placeholder="0.00" step="0.01"
                                   type="number">
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="promo-max-discount">Max Discount Amount</label>
                            <input class="form-input" id="promo-max-discount" min="0" placeholder="0.00" step="0.01"
                                   type="number">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label" for="promo-usage-limit">Usage Limit</label>
                            <input class="form-input" id="promo-usage-limit" min="0" placeholder="Unlimited"
                                   type="number">
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="promo-user-limit">Per-User Limit</label>
                            <input class="form-input" id="promo-user-limit" min="0" placeholder="Unlimited"
                                   type="number">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label" for="promo-valid-from">Valid From *</label>
                            <input class="form-input" id="promo-valid-from" required type="datetime-local">
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="promo-valid-until">Valid Until *</label>
                            <input class="form-input" id="promo-valid-until" required type="datetime-local">
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="form-label flex items-center gap-sm">
                            <input checked id="promo-active" type="checkbox"> Active
                        </label>
                    </div>
                    <div class="flex gap-sm mt-md">
                        <button class="btn btn-primary" id="promo-save-btn" type="submit">Save</button>
                        <button class="btn btn-secondary" id="promo-cancel-btn" type="button">Cancel</button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <th:block th:replace="~{fragments/footer :: footer}"></th:block>
    <script th:src="@{/js/pagination.js}"></script>
    <script>
        (function () {
            'use strict';
            var editingId = null;
            var currentPage = 0;
            var PAGE_SIZE = 20;

            function toLocalDateTime(iso) {
                if (!iso) return '';
                var d = new Date(iso);
                var off = d.getTimezoneOffset();
                var local = new Date(d.getTime() - off * 60000);
                return local.toISOString().slice(0, 16);
            }

            function toISOString(localVal) {
                if (!localVal) return null;
                return new Date(localVal).toISOString();
            }

            function openModal(promo) {
                editingId = promo ? promo.id : null;
                document.getElementById('promo-modal-title').textContent = promo ? 'Edit Promo Code' : 'Add Promo Code';
                document.getElementById('promo-id').value = promo ? promo.id : '';
                document.getElementById('promo-code').value = promo ? (promo.code || '') : '';
                document.getElementById('promo-description').value = promo ? (promo.description || '') : '';
                document.getElementById('promo-discount-type').value = promo ? promo.discountType : 'PERCENTAGE';
                document.getElementById('promo-discount-value').value = promo ? promo.discountValue : '';
                document.getElementById('promo-coupon-type').value = promo ? (promo.couponType || '') : '';
                document.getElementById('promo-min-item-qty').value = promo ? (promo.minItemQuantity != null ? promo.minItemQuantity : '') : '';
                document.getElementById('promo-min-order').value = promo ? (promo.minOrderAmount || '') : '';
                document.getElementById('promo-max-discount').value = promo ? (promo.maxDiscountAmount || '') : '';
                document.getElementById('promo-usage-limit').value = promo ? (promo.usageLimit || '') : '';
                document.getElementById('promo-user-limit').value = promo ? (promo.userUsageLimit || '') : '';
                document.getElementById('promo-valid-from').value = promo ? toLocalDateTime(promo.validFrom) : '';
                document.getElementById('promo-valid-until').value = promo ? toLocalDateTime(promo.validUntil) : '';
                document.getElementById('promo-active').checked = promo ? promo.active : true;
                document.getElementById('promo-save-btn').textContent = promo ? 'Update' : 'Save';
                document.getElementById('promo-save-btn').disabled = false;
                document.getElementById('promo-modal').classList.add('active');
            }

            function closeModal() {
                document.getElementById('promo-modal').classList.remove('active');
                editingId = null;
            }

            function renderPromoCodes(promos) {
                var tbody = document.getElementById('promo-body');
                if (!promos || promos.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="13" class="text-center text-muted">No promo codes found</td></tr>';
                    return;
                }
                tbody.innerHTML = '';
                promos.forEach(function (p) {
                    var tr = document.createElement('tr');
                    var statusBadge = p.active
                        ? '<span class="status-badge in-stock">Active</span>'
                        : '<span class="status-badge out-of-stock">Inactive</span>';
                    var typeLabel = p.discountType === 'PERCENTAGE' ? '%' : '$';
                    var usageText = p.usageLimit ? p.usedCount + ' / ' + p.usageLimit : p.usedCount + ' / ∞';
                    var userLimitText = p.userUsageLimit || '∞';
                    tr.innerHTML =
                        '<td>' + p.id + '</td>' +
                        '<td><strong><code>' + escapeHtml(p.code) + '</code></strong></td>' +
                        '<td class="text-sm">' + p.discountType + '</td>' +
                        '<td class="text-sm">' + (p.couponType || '—') + '</td>' +
                        '<td class="text-sm">' + typeLabel + ' ' + p.discountValue + '</td>' +
                        '<td class="text-sm">' + (p.minOrderAmount ? '$' + p.minOrderAmount : '—') + '</td>' +
                        '<td class="text-sm">' + (p.minItemQuantity != null ? p.minItemQuantity : '—') + '</td>' +
                        '<td class="text-sm">' + (p.maxDiscountAmount ? '$' + p.maxDiscountAmount : '—') + '</td>' +
                        '<td class="text-sm">' + usageText + '</td>' +
                        '<td class="text-sm">' + formatDateTime(p.validFrom) + '</td>' +
                        '<td class="text-sm">' + formatDateTime(p.validUntil) + '</td>' +
                        '<td>' + statusBadge + '</td>' +
                        '<td class="admin-table-actions">' +
                        '<button class="btn btn-sm btn-secondary promo-edit-btn" data-id="' + p.id + '">Edit</button> ' +
                        '<button class="btn btn-sm btn-ghost promo-toggle-btn" data-id="' + p.id + '" title="Toggle Active">' +
                        (p.active ? '🟢' : '⚪') +
                        '</button> ' +
                        '<button class="btn btn-sm btn-danger promo-delete-btn" data-id="' + p.id + '">Delete</button>' +
                        '</td>';
                    tbody.appendChild(tr);
                });

                tbody.querySelectorAll('.promo-edit-btn').forEach(function (btn) {
                    btn.addEventListener('click', function () {
                        var id = this.dataset.id;
                        var found = promos.find(function (p) {
                            return p.id == id;
                        });
                        if (found) openModal(found);
                    });
                });

                tbody.querySelectorAll('.promo-toggle-btn').forEach(function (btn) {
                    btn.addEventListener('click', function () {
                        var id = this.dataset.id;
                        API.patch('/api/admin/promo-codes/' + id + '/toggle').then(function () {
                            showToast('Promo code status toggled', 'success');
                            loadPromoCodes();
                        }).catch(function (e) {
                            showToast(e.message || 'Failed to toggle', 'error');
                        });
                    });
                });

                tbody.querySelectorAll('.promo-delete-btn').forEach(function (btn) {
                    btn.addEventListener('click', function () {
                        var id = this.dataset.id;
                        showConfirmModal({
                            title: 'Delete Promo Code',
                            message: 'Are you sure you want to delete this promo code?',
                            confirmText: 'Delete',
                            danger: true
                        }).then(function (confirmed) {
                            if (!confirmed) return;
                            API.del('/api/admin/promo-codes/' + id).then(function () {
                                showToast('Promo code deleted', 'success');
                                loadPromoCodes();
                            }).catch(function (e) {
                                showToast(e.message || 'Failed to delete', 'error');
                            });
                        });
                    });
                });
            }

            function loadPromoCodes(page) {
                if (page != null) currentPage = page;
                API.get('/api/admin/promo-codes?page=' + currentPage + '&size=' + PAGE_SIZE).then(function (data) {
                    var items = data && data.content ? data.content : [];
                    renderPromoCodes(items);
                    Pagination.render('promo-pagination', data, loadPromoCodes, {
                        onPageSizeChange: function (newSize) {
                            PAGE_SIZE = newSize;
                            loadPromoCodes(0);
                        }
                    });
                }).catch(function () {
                    document.getElementById('promo-body').innerHTML =
                        '<tr><td colspan="13" class="text-center text-muted">Failed to load promo codes</td></tr>';
                });
            }

            document.addEventListener('DOMContentLoaded', function () {
                loadPromoCodes();

                document.getElementById('add-promo-btn').addEventListener('click', function () {
                    openModal(null);
                });
                document.getElementById('promo-modal-close').addEventListener('click', closeModal);
                document.getElementById('promo-cancel-btn').addEventListener('click', closeModal);
                document.getElementById('promo-modal').addEventListener('click', function (e) {
                    if (e.target === this) closeModal();
                });

                document.getElementById('promo-form').addEventListener('submit', function (e) {
                    e.preventDefault();
                    var couponTypeVal = document.getElementById('promo-coupon-type').value;
                    var minItemQtyVal = document.getElementById('promo-min-item-qty').value;
                    var data = {
                        code: document.getElementById('promo-code').value.trim(),
                        description: document.getElementById('promo-description').value.trim() || null,
                        discountType: document.getElementById('promo-discount-type').value,
                        discountValue: parseFloat(document.getElementById('promo-discount-value').value),
                        couponType: couponTypeVal || null,
                        minItemQuantity: minItemQtyVal ? parseInt(minItemQtyVal) : null,
                        minOrderAmount: parseFloat(document.getElementById('promo-min-order').value) || null,
                        maxDiscountAmount: parseFloat(document.getElementById('promo-max-discount').value) || null,
                        usageLimit: parseInt(document.getElementById('promo-usage-limit').value) || null,
                        userUsageLimit: parseInt(document.getElementById('promo-user-limit').value) || null,
                        validFrom: toISOString(document.getElementById('promo-valid-from').value),
                        validUntil: toISOString(document.getElementById('promo-valid-until').value),
                        active: document.getElementById('promo-active').checked
                    };
                    var btn = document.getElementById('promo-save-btn');
                    setButtonLoading(btn, true);
                    var apiCall = editingId
                        ? API.put('/api/admin/promo-codes/' + editingId, data)
                        : API.post('/api/admin/promo-codes', data);
                    apiCall.then(function () {
                        showToast(editingId ? 'Promo code updated' : 'Promo code created', 'success');
                        closeModal();
                        loadPromoCodes();
                    }).catch(function (err) {
                        showToast(err.message || 'Failed to save', 'error');
                        setButtonLoading(btn, false);
                    });
                });
            });
        })();
    </script>
</body>
</html>
