<!DOCTYPE html>
<html lang="en" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Checkout')}"></head>
<body>
    <th:block th:replace="~{fragments/header :: header}"></th:block>
    <th:block th:replace="~{fragments/alerts :: toast-container}"></th:block>

    <main class="page">
        <div class="container">
            <div class="page-header">
                <h1>Checkout</h1>
            </div>

            <div aria-valuemax="3" aria-valuemin="1" aria-valuenow="2" class="checkout-progress" role="progressbar">
                <span class="step completed"><a class="step-link" href="/cart"><span
                        class="step-dot"></span> Cart</a></span>
                <span class="step-line"></span>
                <span class="step active"><span class="step-dot"></span> Details</span>
                <span class="step-line"></span>
                <span class="step"><span class="step-dot"></span> Pay</span>
            </div>

            <div class="guest-banner" sec:authorize="!isAuthenticated()">
                <p>Checking out as a guest. <a class="btn-link" th:href="@{/login}">Sign in</a> for faster checkout.</p>
            </div>

            <div class="flex-center" id="checkout-loading" style="padding:3rem;">
                <span class="spinner"></span>
            </div>

            <form class="checkout-page" id="checkout-form" style="display:none;">
                <div class="checkout-main">
                    <section aria-labelledby="shipping-heading" class="checkout-section">
                        <div class="checkout-section-header">
                            <h2 id="shipping-heading"><span class="checkout-step-number">1</span> Shipping Address</h2>
                        </div>
                        <div id="address-list"></div>
                        <div class="text-muted text-sm mb-md" id="no-addresses" style="display:none;">
                            No saved addresses. Please add one in your <a class="btn-link"
                                                                          href="/address?return=/checkout">address
                            book</a> first.
                        </div>
                    </section>

                    <section aria-labelledby="review-heading" class="checkout-section">
                        <div class="checkout-section-header">
                            <h2 id="review-heading"><span class="checkout-step-number">2</span> Review Items</h2>
                        </div>
                        <div id="review-items"></div>
                    </section>
                </div>

                <aside class="checkout-sidebar">
                    <div class="checkout-section">
                        <div class="cart-summary-title">Order Summary</div>
                        <div class="cart-summary-row"><span>Subtotal</span><span id="checkout-subtotal">$0.00</span>
                        </div>
                        <div class="cart-summary-row" id="checkout-discount-row" style="display:none;">
                            <span>Discount</span><span class="text-success" id="checkout-discount">-$0.00</span></div>
                        <div class="cart-summary-row"><span>Shipping</span><span>Calculated at checkout</span></div>
                        <div class="cart-summary-row total"><span>Total</span><span id="checkout-total">$0.00</span>
                        </div>
                        <div class="cart-promo">
                            <input aria-label="Promo code" class="form-input" id="checkout-promo-input" placeholder="Promo code"
                                   type="text">
                            <button class="btn btn-sm btn-secondary" id="checkout-promo-apply" type="button">Apply
                            </button>
                            <button class="btn btn-sm btn-danger" id="checkout-promo-remove" style="display:none;"
                                    type="button">Remove
                            </button>
                        </div>
                        <div class="text-sm mt-sm" id="checkout-promo-msg" style="display:none;"></div>
                        <div class="cart-actions">
                            <button class="btn btn-primary btn-lg btn-block" id="pay-btn" type="submit">Pay</button>
                        </div>
                    </div>
                </aside>
            </form>
        </div>
    </main>

    <th:block th:replace="~{fragments/footer :: footer}"></th:block>
    <script src="/js/sanitize.js"></script>
    <script>
        (function () {
            'use strict';
            var selectedAddressId = null;
            var appliedPromoCode = null;
            var cartSubtotal = 0;
            var discountAmount = 0;
            var checkoutCartData = null;

            function renderAddresses(addresses) {
                var list = document.getElementById('address-list');
                var noMsg = document.getElementById('no-addresses');
                if (!addresses || addresses.length === 0) {
                    list.style.display = 'none';
                    noMsg.style.display = '';
                    return;
                }
                noMsg.style.display = 'none';
                list.style.display = '';
                list.innerHTML = '<div class="address-radio-list"></div>';
                var container = list.querySelector('.address-radio-list');
                addresses.forEach(function (addr) {
                    var div = document.createElement('label');
                    div.className = 'payment-method' + (addr['default'] ? ' selected' : '');
                    div.innerHTML =
                        '<input type="radio" name="addressId" value="' + escapeAttr(String(addr.id)) + '"' + (addr['default'] ? ' checked' : '') + '>' +
                        '<div>' +
                        '<div class="method-label">' + escapeHtml(addr.fullName || '') + (addr.label ? ' (' + escapeHtml(addr.label) + ')' : '') + '</div>' +
                        '<div class="method-desc">' +
                        escapeHtml(addr.line1 || '') + (addr.line2 ? ', ' + escapeHtml(addr.line2) : '') + '<br>' +
                        escapeHtml(addr.city || '') + ', ' + escapeHtml(addr.state || '') + ' ' + escapeHtml(addr.postalCode || '') + '<br>' +
                        escapeHtml(addr.country || '') +
                        (addr.phone ? ' · ' + escapeHtml(addr.phone) : '') +
                        '</div>' +
                        '</div>';
                    div.querySelector('input').addEventListener('change', function () {
                        selectedAddressId = addr.id;
                        container.querySelectorAll('.payment-method').forEach(function (el) {
                            el.classList.remove('selected');
                        });
                        div.classList.add('selected');
                    });
                    if (addr['default']) selectedAddressId = addr.id;
                    container.appendChild(div);
                });
                if (!selectedAddressId && addresses.length > 0) selectedAddressId = addresses[0].id;
            }

            function renderReviewItems(cart) {
                var container = document.getElementById('review-items');
                container.innerHTML = '';
                (cart.items || []).forEach(function (item) {
                    var imgUrl = item.imageUrl || 'https://plus.unsplash.com/premium_photo-1683746792239-6ce8cdd3ac78?q=80&w=48&fit=crop';
                    var div = document.createElement('div');
                    div.className = 'order-review-item';
                    div.innerHTML =
                        '<img class="item-thumb" src="' + escapeAttr(imgUrl) + '" alt="" loading="lazy" width="48" height="48">' +
                        '<div class="item-info">' +
                        '<div class="item-name">' + escapeHtml(item.itemName || 'Product') + '</div>' +
                        '<div class="item-qty">Qty: ' + item.quantity + '</div>' +
                        '</div>' +
                        '<div class="item-price">' + formatCurrency(item.lineTotal) + '</div>';
                    container.appendChild(div);
                });
                document.getElementById('checkout-subtotal').textContent = formatCurrency(cart.subtotal);
                document.getElementById('checkout-total').textContent = formatCurrency(cart.subtotal);
                cartSubtotal = cart.subtotal;

                var savedPromo = sessionStorage.getItem('promoCode');
                if (savedPromo) {
                    applyPromo(savedPromo);
                }
            }

            function showPromoApplied(discount) {
                var msgEl = document.getElementById('checkout-promo-msg');
                msgEl.style.display = 'block';
                msgEl.innerHTML = '<span class="text-success">Promo applied! You save ' + formatCurrency(discount) + '</span>';
                document.getElementById('checkout-discount-row').style.display = '';
                document.getElementById('checkout-discount').textContent = '-' + formatCurrency(discount);
                document.getElementById('checkout-total').textContent = formatCurrency(cartSubtotal - discount);

                document.getElementById('checkout-promo-apply').style.display = 'none';
                document.getElementById('checkout-promo-remove').style.display = '';
                document.getElementById('checkout-promo-input').disabled = true;
            }

            function clearPromoState(message) {
                appliedPromoCode = null;
                discountAmount = 0;
                sessionStorage.removeItem('promoCode');

                var msgEl = document.getElementById('checkout-promo-msg');
                if (message) {
                    msgEl.style.display = 'block';
                    msgEl.innerHTML = '<span class="text-danger">' + escapeHtml(message) + '</span>';
                } else {
                    msgEl.style.display = 'none';
                }

                document.getElementById('checkout-discount-row').style.display = 'none';
                document.getElementById('checkout-total').textContent = formatCurrency(cartSubtotal);

                var applyBtn = document.getElementById('checkout-promo-apply');
                applyBtn.style.display = '';
                applyBtn.textContent = 'Apply';
                applyBtn.disabled = false;
                document.getElementById('checkout-promo-remove').style.display = 'none';
                document.getElementById('checkout-promo-input').disabled = false;
            }

            function buildCartPreviewItems() {
                if (!checkoutCartData || !checkoutCartData.items) return [];
                return checkoutCartData.items.map(function (item) {
                    return {
                        itemDetailsId: item.itemDetailsId,
                        quantity: item.quantity,
                        unitPrice: item.unitPrice
                    };
                });
            }

            function applyPromo(code) {
                var btn = document.getElementById('checkout-promo-apply');
                setButtonLoading(btn, true);
                document.getElementById('checkout-promo-input').value = code;
                API.post('/api/promo-codes/validate', {
                    code: code,
                    subtotal: cartSubtotal,
                    cartItems: buildCartPreviewItems()
                }).then(function (res) {
                    appliedPromoCode = code;
                    discountAmount = parseFloat(res.discount);
                    sessionStorage.setItem('promoCode', code);
                    showPromoApplied(discountAmount);
                    setButtonLoading(btn, false);
                }).catch(function (err) {
                    clearPromoState(err.message || 'Invalid promo code');
                    setButtonLoading(btn, false);
                });
            }

            function applyPromoCode() {
                var input = document.getElementById('checkout-promo-input');
                var msgEl = document.getElementById('checkout-promo-msg');
                var code = input.value.trim();
                if (!code) {
                    msgEl.style.display = 'block';
                    msgEl.innerHTML = '<span class="text-danger">Please enter a promo code</span>';
                    return;
                }
                applyPromo(code);
            }

            function removePromo() {
                clearPromoState(null);
                document.getElementById('checkout-promo-input').value = '';
                document.getElementById('checkout-promo-msg').style.display = 'none';
            }

            function init() {
                document.getElementById('checkout-loading').style.display = 'none';
                document.getElementById('checkout-form').style.display = '';
            }

            document.addEventListener('DOMContentLoaded', function () {
                Promise.all([
                    API.get('/user/cart/get'),
                    API.get('/user/address/get/all')
                ]).then(function (results) {
                    var cart = results[0];
                    checkoutCartData = cart;
                    var addresses = results[1];
                    renderReviewItems(cart);
                    renderAddresses(addresses);
                    init();
                }).catch(function (err) {
                    showToast(err.message || 'Failed to load checkout data', 'error');
                    init();
                });

                document.getElementById('checkout-promo-apply').addEventListener('click', applyPromoCode);
                document.getElementById('checkout-promo-remove').addEventListener('click', removePromo);

                document.getElementById('checkout-form').addEventListener('submit', function (e) {
                    e.preventDefault();
                    if (!selectedAddressId) {
                        showToast('Please select a shipping address', 'error');
                        return;
                    }
                    sessionStorage.setItem('checkoutAddressId', selectedAddressId);
                    if (appliedPromoCode) {
                        sessionStorage.setItem('promoCode', appliedPromoCode);
                    } else {
                        sessionStorage.removeItem('promoCode');
                    }
                    window.location.href = '/payment';
                });
            });
        })();
    </script>
</body>
</html>
