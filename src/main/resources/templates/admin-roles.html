<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Manage Roles')}"></head>
<body>
    <th:block th:replace="~{fragments/admin-header :: admin-header('roles')}"></th:block>
    <th:block th:replace="~{fragments/alerts :: toast-container}"></th:block>

    <main class="admin-main">
        <div class="page-header">
            <h1>Roles</h1>
            <p>Manage system roles</p>
        </div>

        <div class="admin-panel">
            <div class="admin-panel-header">
                <div class="admin-panel-title">All Roles</div>
            </div>
            <div class="table-responsive">
                <table class="admin-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Role Name</th>
                        </tr>
                    </thead>
                    <tbody id="roles-body">
                        <tr>
                            <td class="text-center text-muted" colspan="2">Loading...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="admin-panel mt-lg">
            <div class="admin-panel-title">Create Role</div>
            <form class="flex-between items-center gap-md" id="role-form" style="max-width:100%;">
                <div class="form-group" style="flex:1;">
                    <label class="form-label" for="role-name">Role Name</label>
                    <input class="form-input" id="role-name" maxlength="50" minlength="2"
                           pattern="^[A-Z][A-Z0-9_]*$" placeholder="ROLE_NAME" required type="text">
                </div>
                <button class="btn btn-primary btn-sm" type="submit">Create</button>
            </form>
        </div>
    </main>

    <th:block th:replace="~{fragments/footer :: footer}"></th:block>
    <script src="/js/sanitize.js"></script>
    <script>
        (function () {
            'use strict';

            function renderRoles(roles) {
                var tbody = document.getElementById('roles-body');
                if (!roles || roles.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="2" class="text-center text-muted">No roles found</td></tr>';
                    return;
                }
                tbody.innerHTML = '';
                roles.forEach(function (r) {
                    var tr = document.createElement('tr');
                    tr.innerHTML = '<td>' + (r.id || '') + '</td><td><strong>' + escapeHtml(r.roleName || '') + '</strong></td>';
                    tbody.appendChild(tr);
                });
            }

            function loadRoles() {
                API.get('/roles/all').then(renderRoles).catch(function () {
                    document.getElementById('roles-body').innerHTML =
                        '<tr><td colspan="2" class="text-center text-muted">Failed to load</td></tr>';
                });
            }

            document.addEventListener('DOMContentLoaded', function () {
                loadRoles();
                document.getElementById('role-form').addEventListener('submit', function (e) {
                    e.preventDefault();
                    var name = document.getElementById('role-name').value.trim();
                    if (!name) return;
                    API.post('/roles/create/' + encodeURIComponent(name), {}).then(function () {
                        showToast('Role created', 'success');
                        document.getElementById('role-name').value = '';
                        loadRoles();
                    }).catch(function (err) {
                        showToast(err.message || 'Failed to create role', 'error');
                    });
                });
            });
        })();
    </script>
</body>
</html>
