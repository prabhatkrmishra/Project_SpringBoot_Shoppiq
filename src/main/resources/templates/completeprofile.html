<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Complete Profile')}"></head>
<body>
    <th:block th:replace="~{fragments/header :: header}"></th:block>
    <th:block th:replace="~{fragments/alerts :: toast-container}"></th:block>

    <main class="page">
        <div class="container container-narrow auth-card">
            <div class="page-header text-center">
                <h1>Complete Your Profile</h1>
                <p class="text-muted">Google account verified. Choose a username and password to finish
                    registration.</p>
            </div>

            <div class="guest-banner" role="alert" th:if="${param.error}">
                <p th:text="${param.error}">Error</p>
            </div>

            <div class="panel">
                <form id="completeProfileForm" novalidate>
                    <div class="form-group">
                        <label class="form-label" for="name">Full Name</label>
                        <input aria-readonly="true" class="form-input auth-readonly" id="name" readonly type="text">
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="email">Email Address</label>
                        <input aria-readonly="true" class="form-input auth-readonly" id="email" readonly type="email">
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="username">Username</label>
                        <input autocomplete="username" class="form-input" id="username" maxlength="30"
                               minlength="3" name="username" pattern="^[a-zA-Z0-9_]+$"
                               placeholder="Choose a username" required type="text">
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="password">Password</label>
                        <input autocomplete="new-password" class="form-input" id="password" minlength="8"
                               name="password" placeholder="Choose a password" required type="password">
                        <div class="form-error" id="password-error"></div>
                        <div class="password-requirements">
                            <span class="req" id="req-length"><i class="icon-xs" data-lucide="check"></i> At least 8 characters</span>
                            <span class="req" id="req-upper"><i class="icon-xs" data-lucide="check"></i> One uppercase letter</span>
                            <span class="req" id="req-lower"><i class="icon-xs" data-lucide="check"></i> One lowercase letter</span>
                            <span class="req" id="req-digit"><i class="icon-xs"
                                                                data-lucide="check"></i> One number</span>
                            <span class="req" id="req-special"><i class="icon-xs" data-lucide="check"></i> One special char (@$!%*?&)</span>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="confirmPassword">Confirm Password</label>
                        <input autocomplete="new-password" class="form-input" id="confirmPassword" name="confirmPassword"
                               placeholder="Confirm password" required type="password">
                        <div class="form-error" id="confirmPassword-error"></div>
                    </div>
                    <button class="btn btn-primary btn-block" type="submit">Complete Registration</button>
                </form>
            </div>
        </div>
    </main>

    <th:block th:replace="~{fragments/footer :: footer}"></th:block>

    <script th:inline="javascript">
        /*<![CDATA[*/
        async function loadGoogleProfile() {
            try {
                const profile = await API.get('/auth/google/get-profile');
                document.getElementById("name").value = profile.name || "";
                document.getElementById("email").value = profile.email || "";
            } catch (err) {
                console.error(err);
                showToast("Unable to load Google profile information. Please sign in with Google again.", "error");
            }
        }

        document.addEventListener("DOMContentLoaded", loadGoogleProfile);

        const passwordInput = document.getElementById("password");
        const confirmPasswordInput = document.getElementById("confirmPassword");

        function validatePasswordRequirements(password) {
            return {
                length: password.length >= 8,
                upper: /[A-Z]/.test(password),
                lower: /[a-z]/.test(password),
                digit: /[0-9]/.test(password),
                special: /[@$!%*?&]/.test(password)
            };
        }

        function updatePasswordRequirements(password) {
            const reqs = validatePasswordRequirements(password);
            document.getElementById("req-length").classList.toggle("met", reqs.length);
            document.getElementById("req-upper").classList.toggle("met", reqs.upper);
            document.getElementById("req-lower").classList.toggle("met", reqs.lower);
            document.getElementById("req-digit").classList.toggle("met", reqs.digit);
            document.getElementById("req-special").classList.toggle("met", reqs.special);
        }

        function showFieldError(fieldId, message) {
            const errorEl = document.getElementById(fieldId + "-error");
            const inputEl = document.getElementById(fieldId);
            if (errorEl) errorEl.textContent = message;
            if (inputEl) inputEl.classList.add("is-invalid");
        }

        function clearFieldError(fieldId) {
            const errorEl = document.getElementById(fieldId + "-error");
            const inputEl = document.getElementById(fieldId);
            if (errorEl) errorEl.textContent = "";
            if (inputEl) inputEl.classList.remove("is-invalid");
        }

        function clearAllErrors() {
            ["password", "confirmPassword"].forEach(clearFieldError);
        }

        passwordInput.addEventListener("input", function () {
            clearFieldError("password");
            updatePasswordRequirements(this.value);
            toggleReqs();
        });

        var passwordReqs = passwordInput.closest('.form-group').querySelector('.password-requirements');

        function toggleReqs() {
            if (!passwordReqs) return;
            var pw = passwordInput.value;
            var cpw = confirmPasswordInput.value;
            if (pw && cpw && pw === cpw) {
                passwordReqs.classList.remove("visible");
            } else if (pw) {
                passwordReqs.classList.add("visible");
            } else {
                passwordReqs.classList.remove("visible");
            }
        }

        if (passwordReqs) {
            passwordInput.addEventListener("focus", function () {
                if (this.value) passwordReqs.classList.add("visible");
            });
        }
        confirmPasswordInput.addEventListener("input", function () {
            clearFieldError("confirmPassword");
            toggleReqs();
        });

        document.getElementById("completeProfileForm").addEventListener("submit", async function (event) {
            event.preventDefault();
            clearAllErrors();

            const username = document.getElementById("username").value.trim();
            const password = passwordInput.value;
            const confirmPassword = confirmPasswordInput.value;
            const reqs = validatePasswordRequirements(password);

            let hasError = false;
            if (!username) {
                showFieldError("username", "Username is required");
                hasError = true;
            }
            if (!reqs.length || !reqs.upper || !reqs.lower || !reqs.digit || !reqs.special) {
                showFieldError("password", "Password must contain uppercase, lowercase, number, and special character (@$!%*?&)");
                hasError = true;
            }
            if (password !== confirmPassword) {
                showFieldError("confirmPassword", "Passwords do not match");
                hasError = true;
            }
            if (hasError) return;
            try {
                await API.post('/auth/google/complete-profile', {
                    username: username,
                    password: password
                });
                showToast("Registration completed successfully!", "success");
                var ru = new URLSearchParams(window.location.search).get("returnUrl");
                var dest = (ru && ru.startsWith("/") && !ru.startsWith("//")) ? ru : "/allitems";
                setTimeout(() => {
                    window.location.href = dest;
                }, 800);
            } catch (err) {
                showToast(err.message || "Unable to connect to server", "error");
            }
        });
        /*]]>*/
    </script>
</body>
</html>
