<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Payment')}"></head>
<body>
    <th:block th:replace="~{fragments/header :: header}"></th:block>
    <th:block th:replace="~{fragments/alerts :: toast-container}"></th:block>

    <main class="page">
        <div class="container">
            <div class="page-header">
                <h1>Payment</h1>
            </div>

            <div aria-valuemax="3" aria-valuemin="1" aria-valuenow="3" class="checkout-progress" role="progressbar">
                <span class="step completed"><a class="step-link" href="/cart"><span
                        class="step-dot"></span> Cart</a></span>
                <span class="step-line"></span>
                <span class="step completed"><a class="step-link" href="/checkout"><span class="step-dot"></span> Details</a></span>
                <span class="step-line"></span>
                <span class="step active"><span class="step-dot"></span> Pay</span>
            </div>

            <div class="flex-center" id="payment-loading" style="padding:3rem;">
                <span class="spinner"></span>
            </div>

            <div id="payment-error" style="display:none;">
                <div class="panel text-center">
                    <p id="payment-error-msg">Unable to load payment details.</p>
                    <a class="btn btn-secondary mt-md" href="/cart">Back to Cart</a>
                </div>
            </div>

            <form class="checkout-page" id="payment-form" style="display:none;">
                <div class="checkout-main">
                    <section aria-labelledby="payment-type-heading" class="checkout-section">
                        <div class="checkout-section-header">
                            <h2 id="payment-type-heading"><span class="checkout-step-number">1</span> Payment Type</h2>
                        </div>
                        <div class="payment-methods">
                            <label class="payment-method selected">
                                <input checked name="paymentMethod" type="radio" value="CREDIT_CARD">
                                <div>
                                    <div class="method-label">Credit Card</div>
                                    <div class="method-desc">Visa, Mastercard, Amex</div>
                                </div>
                            </label>
                            <label class="payment-method">
                                <input name="paymentMethod" type="radio" value="PAYPAL">
                                <div>
                                    <div class="method-label">PayPal</div>
                                    <div class="method-desc">Pay with your PayPal account</div>
                                </div>
                            </label>
                            <label class="payment-method">
                                <input name="paymentMethod" type="radio" value="STRIPE">
                                <div>
                                    <div class="method-label">Stripe</div>
                                    <div class="method-desc">Secure card payments via Stripe</div>
                                </div>
                            </label>
                            <label class="payment-method">
                                <input name="paymentMethod" type="radio" value="UPI">
                                <div>
                                    <div class="method-label">UPI</div>
                                    <div class="method-desc">Google Pay, PhonePe, Paytm, BHIM</div>
                                </div>
                            </label>
                            <label class="payment-method">
                                <input name="paymentMethod" type="radio" value="COD">
                                <div>
                                    <div class="method-label">Cash on Delivery</div>
                                    <div class="method-desc">Pay when you receive your order (+ $5.00 COD charge)</div>
                                </div>
                            </label>
                        </div>
                    </section>

                    <section aria-labelledby="delivery-type-heading" class="checkout-section">
                        <div class="checkout-section-header">
                            <h2 id="delivery-type-heading"><span class="checkout-step-number">2</span> Delivery Type
                            </h2>
                        </div>
                        <div class="payment-methods">
                            <label class="payment-method selected">
                                <input checked name="deliveryType" type="radio" value="NORMAL">
                                <div>
                                    <div class="method-label">Normal Delivery</div>
                                    <div class="method-desc">Free shipping — delivered in 5-7 business days</div>
                                </div>
                            </label>
                            <label class="payment-method">
                                <input name="deliveryType" type="radio" value="EXPRESS_1DAY">
                                <div>
                                    <div class="method-label">1-Day Express Delivery</div>
                                    <div class="method-desc">Get it tomorrow — $7.50 delivery charge</div>
                                </div>
                            </label>
                        </div>
                    </section>
                </div>

                <aside class="checkout-sidebar">
                    <div class="checkout-section">
                        <div class="cart-summary-title">Payment Summary</div>
                        <div class="cart-summary-row">
                            <span>Product Cost</span>
                            <span id="pay-subtotal">$0.00</span>
                        </div>
                        <div class="cart-summary-row" id="pay-discount-row" style="display:none;">
                            <span>Discount</span>
                            <span class="text-success" id="pay-discount">-$0.00</span>
                        </div>
                        <div class="cart-summary-row">
                            <span>Delivery Charge</span>
                            <span id="pay-delivery">Free</span>
                        </div>
                        <div class="cart-summary-row" id="pay-cod-row" style="display:none;">
                            <span>COD Surcharge</span>
                            <span id="pay-cod-fee">$5.00</span>
                        </div>
                        <div class="cart-summary-row total">
                            <span>Total</span>
                            <span id="pay-total">$0.00</span>
                        </div>
                        <div class="cart-promo" id="pay-promo-row" style="display:none;">
                            <input aria-label="Applied promo code" class="form-input" id="pay-promo-input" readonly style="flex:1;"
                                   type="text" value="">
                            <button class="btn btn-sm btn-danger" id="pay-promo-remove" type="button">Remove</button>
                        </div>
                        <div class="cart-actions">
                            <button class="btn btn-primary btn-lg btn-block" id="place-order-btn" type="submit">Place
                                Order
                            </button>
                        </div>
                    </div>
                </aside>
            </form>
        </div>
    </main>

    <th:block th:replace="~{fragments/footer :: footer}"></th:block>
    <script src="/js/sanitize.js"></script>
    <script>
        (function () {
            'use strict';

            var addressId = null;
            var promoCode = null;
            var currentCalc = null;

            function showPaymentError(msg) {
                document.getElementById('payment-loading').style.display = 'none';
                document.getElementById('payment-error').style.display = '';
                document.getElementById('payment-error-msg').textContent = msg || 'Unable to load payment details.';
            }

            function setCalcLoading(loading) {
                var el = document.getElementById('pay-subtotal');
                if (!el) return;
                if (loading) {
                    el.textContent = 'Calculating...';
                }
            }

            function showPromoRow(code) {
                var row = document.getElementById('pay-promo-row');
                row.style.display = '';
                document.getElementById('pay-promo-input').value = code;
            }

            function hidePromoRow() {
                document.getElementById('pay-promo-row').style.display = 'none';
            }

            function clearPromoFromState(reason) {
                promoCode = null;
                sessionStorage.removeItem('promoCode');
                hidePromoRow();
                if (reason) {
                    showToast(reason, 'error');
                }
            }

            function fetchSummary() {
                var paymentRadio = document.querySelector('input[name="paymentMethod"]:checked');
                var deliveryRadio = document.querySelector('input[name="deliveryType"]:checked');

                var payload = {
                    paymentMethod: paymentRadio ? paymentRadio.value : 'CREDIT_CARD',
                    deliveryType: deliveryRadio ? deliveryRadio.value : 'NORMAL'
                };
                if (promoCode) {
                    payload.promoCode = promoCode;
                }

                setCalcLoading(true);

                API.post('/user/order/calculate', payload).then(function (res) {
                    currentCalc = res;
                    renderSummary(res);
                    setCalcLoading(false);
                }).catch(function (err) {
                    setCalcLoading(false);
                    if (promoCode) {
                        showToast(err.message || 'Promo code is invalid. Removing it.', 'error');
                        clearPromoFromState(null);
                        /* Re-fetch summary without the invalid promo (one-shot, no recursion) */
                        API.post('/user/order/calculate', {
                            paymentMethod: payload.paymentMethod,
                            deliveryType: payload.deliveryType
                        }).then(function (res) {
                            currentCalc = res;
                            renderSummary(res);
                        }).catch(function (innerErr) {
                            showPaymentError(innerErr.message || 'Unable to calculate order summary.');
                        });
                    } else {
                        showPaymentError(err.message || 'Unable to calculate order summary.');
                    }
                });
            }

            function renderSummary(res) {
                document.getElementById('pay-subtotal').textContent = formatCurrency(res.subtotal);

                var discountRow = document.getElementById('pay-discount-row');
                if (res.discount && parseFloat(res.discount) > 0) {
                    discountRow.style.display = '';
                    document.getElementById('pay-discount').textContent = '-' + formatCurrency(res.discount);
                } else {
                    discountRow.style.display = 'none';
                }

                document.getElementById('pay-delivery').textContent =
                    res.deliveryCharge && parseFloat(res.deliveryCharge) > 0
                        ? formatCurrency(res.deliveryCharge)
                        : 'Free';

                var codRow = document.getElementById('pay-cod-row');
                if (res.codSurcharge && parseFloat(res.codSurcharge) > 0) {
                    codRow.style.display = '';
                    document.getElementById('pay-cod-fee').textContent = formatCurrency(res.codSurcharge);
                } else {
                    codRow.style.display = 'none';
                }

                document.getElementById('pay-total').textContent = formatCurrency(res.grandTotal);
            }

            function bindRadioListeners() {
                var radios = document.querySelectorAll('input[name="paymentMethod"], input[name="deliveryType"]');
                radios.forEach(function (radio) {
                    radio.addEventListener('change', function () {
                        var group = this.closest('.payment-methods');
                        if (group) {
                            group.querySelectorAll('.payment-method').forEach(function (el) {
                                el.classList.remove('selected');
                            });
                        }
                        this.closest('.payment-method').classList.add('selected');
                        fetchSummary();
                    });
                });
            }

            document.addEventListener('DOMContentLoaded', function () {
                addressId = sessionStorage.getItem('checkoutAddressId');
                promoCode = sessionStorage.getItem('promoCode');

                if (!addressId) {
                    showPaymentError('No shipping address selected. Please go back to checkout.');
                    return;
                }

                if (promoCode) {
                    showPromoRow(promoCode);
                }

                API.get('/user/cart/get').then(function (cart) {
                    if (!cart || !cart.items || cart.items.length === 0) {
                        showPaymentError('Your cart is empty. Please add items before checking out.');
                        return;
                    }
                    bindRadioListeners();
                    fetchSummary();

                    document.getElementById('payment-loading').style.display = 'none';
                    document.getElementById('payment-form').style.display = '';
                }).catch(function (err) {
                    showPaymentError(err.message || 'Failed to load payment data.');
                });

                document.getElementById('pay-promo-remove').addEventListener('click', function () {
                    clearPromoFromState(null);
                    fetchSummary();
                });

                document.getElementById('payment-form').addEventListener('submit', function (e) {
                    e.preventDefault();

                    var paymentMethod = document.querySelector('input[name="paymentMethod"]:checked');
                    var deliveryType = document.querySelector('input[name="deliveryType"]:checked');

                    if (!paymentMethod) {
                        showToast('Please select a payment method', 'error');
                        return;
                    }
                    if (!deliveryType) {
                        showToast('Please select a delivery type', 'error');
                        return;
                    }

                    var btn = document.getElementById('place-order-btn');
                    setButtonLoading(btn, true);

                    API.post('/user/order/checkout', {
                        addressId: parseInt(addressId),
                        paymentMethod: paymentMethod.value,
                        deliveryType: deliveryType.value,
                        promoCode: promoCode
                    }).then(function (res) {
                        showToast('Order placed successfully!', 'success');
                        sessionStorage.removeItem('promoCode');
                        sessionStorage.removeItem('checkoutAddressId');

                        if (paymentMethod.value !== 'COD' && res.paymentId) {
                            var simulatedTxn = 'TEST-' + res.paymentId + '-' + Date.now();
                            return API.post('/user/payment/verify', {
                                paymentId: res.paymentId,
                                transactionId: simulatedTxn
                            }).catch(function (e) {
                                console.warn('Payment verification skipped:', e.message);
                            }).then(function () {
                                return res;
                            });
                        }
                        return res;
                    }).then(function (res) {
                        window.location.href = '/order-detail?id=' + res.orderId;
                    }).catch(function (err) {
                        showToast(err.message || 'Failed to place order', 'error');
                        setButtonLoading(btn, false);
                        /* Clear promo on order failure so retries don't keep
                           hitting the same promo error (already used, limit
                           exceeded, etc.) */
                        if (promoCode) {
                            clearPromoFromState(null);
                        }
                    });
                });
            });
        })();
    </script>
</body>
</html>
