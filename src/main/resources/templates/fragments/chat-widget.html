<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
    <div aria-hidden="true" class="ai-chat-widget" id="ai-chat-widget" th:fragment="widget"
         th:if="${@environment.getProperty('shoppiq.ai.enabled') == 'true'}">

        <button aria-label="AI Assistant" class="ai-chat-toggle" id="ai-chat-toggle">
            <i data-lucide="bot"></i>
            <span aria-hidden="true" class="ai-chat-fallback-icon">AI</span>
        </button>

        <div aria-hidden="true" class="ai-chat-panel" id="ai-chat-panel">
            <div class="ai-chat-header">
                <div class="ai-chat-header-info">
                    <i class="icon-sm" data-lucide="bot"></i>
                    <div>
                        <h3>Shoppiq Assistant</h3>
                        <span class="ai-chat-id" id="ai-chat-id"></span>
                        <span class="ai-chat-user-id" id="ai-chat-user-id"></span>
                    </div>
                </div>
                <div class="ai-chat-header-actions">
                    <select aria-label="Select AI model" class="ai-model-select" id="ai-model-select">
                        <option value="1">Assistant 1</option>
                        <option value="2">Assistant 2</option>
                        <option value="3">Assistant 3</option>
                    </select>
                    <button aria-label="Conversations" class="ai-chat-btn-icon" id="ai-chat-history-btn">
                        <i data-lucide="history"></i>
                    </button>
                    <button aria-label="Close" class="ai-chat-btn-icon" id="ai-chat-close">
                        <i data-lucide="x"></i>
                    </button>
                </div>
            </div>

            <div aria-hidden="true" class="ai-chat-sidebar" id="ai-chat-sidebar">
                <div class="ai-chat-sidebar-header">
                    <h4>Conversations</h4>
                    <button aria-label="New conversation" class="ai-chat-btn-icon" id="ai-chat-new">
                        <i data-lucide="plus"></i>
                    </button>
                </div>
                <div class="ai-chat-sidebar-list" id="ai-chat-sidebar-list"></div>
            </div>

            <div class="ai-chat-messages" id="ai-chat-messages">
                <div class="ai-chat-welcome">
                    <p>Hi! I'm Shoppiq's AI assistant.</p>
                    <p>I can help you find products, check orders, and more.</p>
                </div>
            </div>

            <div aria-hidden="true" class="ai-chat-resolved-banner" id="ai-chat-resolved-banner">
                <p>This conversation has been resolved.</p>
                <button class="btn btn-sm btn-primary" id="ai-chat-new-after-resolve">Start New Conversation</button>
            </div>

            <div class="ai-chat-input-area" id="ai-chat-input-area">
                <div class="ai-chat-input-row">
                <textarea id="ai-chat-input"
                          maxlength="2000"
                          placeholder="Ask me anything..."
                          rows="1"></textarea>
                    <button aria-label="Send message" id="ai-chat-send">
                        <i data-lucide="send"></i>
                    </button>
                </div>
                <div class="ai-chat-input-footer">
                    <button class="ai-chat-resolve-btn" id="ai-chat-resolve-btn">
                        <i data-lucide="check-circle"></i> Mark as Resolved
                    </button>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
